name: Build and Test .NET 8 Application

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Download .NET Installer
      run: |
        Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
        powershell -ExecutionPolicy Bypass -File .\dotnet-install.ps1 -Channel 8.0 -InstallDir D:\dotnet

    - name: Add .NET to PATH
      run: |
        echo ##[add-path]D:\dotnet
        echo ##[add-path]D:\dotnet\tools

    - name: Verify .NET Installation
      run: dotnet --version

    - name: Install dependencies
      run: dotnet restore

    - name: Wait for SQL Server
      run: |
        echo "Waiting for SQL Server to be ready..."
        for /L %%i in (1, 60, 1) do (
          sqlcmd -S localhost -U sa -P "YourStrong!Password" -Q "SELECT 1" && exit /b 0
          timeout /t 1 >nul
        )
        exit /b 1

    - name: Apply Database Migrations
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost;Database=ContatosRegionais_Test;User Id=safiap;Password=123Mudar@Fiap!;"
      run: dotnet ef database update

    - name: Build the application
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --logger trx