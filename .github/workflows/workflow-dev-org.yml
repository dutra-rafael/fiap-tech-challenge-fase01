name: Build and Test .NET 8 Application

on:
  push:
    branches:
      - develop
  pull_request:

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Download .NET Installer
      run: |
        Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
        powershell -ExecutionPolicy Bypass -File .\dotnet-install.ps1 -Channel 8.0 -InstallDir D:\dotnet

    - name: Add .NET to PATH
      run: |
        echo "D:\dotnet" >> $env:GITHUB_PATH
        echo "D:\dotnet\tools" >> $env:GITHUB_PATH

    - name: Verify .NET Installation
      run: dotnet --version

    - name: Wait for SQL Server
      run: |
        Write-Host "Waiting for SQL Server to be ready..."
        $attempt = 0
        $maxAttempts = 60
        while ($attempt -lt $maxAttempts) {
          try {
            Invoke-SqlCmd -ServerInstance "localhost" -Username "fiap" -Password "123Mudar@Fiap02!" -Query "SELECT 1"
            Write-Host "SQL Server is ready!"
            break
          } catch {
            Write-Host "SQL Server is not ready yet. Retrying in 1 second..."
            Start-Sleep -Seconds 1
            $attempt++
          }
        }
        if ($attempt -eq $maxAttempts) {
          Write-Error "SQL Server did not become ready within the expected time."
          exit 1
        }

    - name: Apply Database Migrations
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost;Database=ContatosRegionais_Test;User Id=fiap;Password=123Mudar@Fiap02!;"
      run: dotnet ef database update

    - name: Build the application
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --logger trx